<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Загрузка пользователей DummyJSON без перезагрузки страницы с помощью Alpine.js">
  <title>Пользователи DummyJSON — Alpine.js</title>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    button { font: inherit; color: #0645ad; text-decoration: underline; background: none; border: 0; padding: 0; cursor: pointer; }
    button:disabled { color: #666; cursor: wait; }
    li { margin-block: .35rem; }
    .status { color: #555; }
    .error { color: #b42318; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body>
  <main x-data="userDirectory()">
    <h1>Декларативность</h1>

    <button type="button" @click="loadUsers" :disabled="loading">
      <span x-show="!loading">Список пользователей</span>
      <span x-show="loading" x-cloak>Загрузка…</span>
    </button>

    <p class="status" x-show="!loading && !error && users.length === 0">
      Нажмите на ссылку, чтобы получить данные.
    </p>
    <p class="error" role="alert" x-show="error" x-text="error" x-cloak></p>

    <ul x-show="users.length > 0" x-cloak>
      <template x-for="user in users" :key="user.id">
        <li>
          <strong x-text="`${user.firstName} ${user.lastName}`"></strong>:
          <a :href="`mailto:${user.email}`" x-text="user.email"></a>
        </li>
      </template>
    </ul>
  </main>

  <script>
    function userDirectory() {
      return {
        users: [],
        loading: false,
        error: '',

        async loadUsers() {
          this.loading = true;
          this.error = '';

          try {
            const response = await fetch(
              'https://dummyjson.com/users?limit=5&select=firstName,lastName,email'
            );

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            this.users = data.users;
          } catch (error) {
            console.error('Не удалось загрузить пользователей:', error);
            this.error = 'Не удалось загрузить пользователей. Попробуйте ещё раз.';
          } finally {
            this.loading = false;
          }
        }
      };
    }
  </script>
</body>
</html>
