<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Загрузка пользователей DummyJSON без перезагрузки страницы с помощью htmx и Handlebars">
  <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
  <title>Пользователи DummyJSON — htmx + Handlebars</title>
  <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/htmx-ext-client-side-templates@2.0.2/client-side-templates.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/handlebars@4.7.10/dist/handlebars.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    button { font: inherit; color: #0645ad; text-decoration: underline; background: none; border: 0; padding: 0; cursor: pointer; }
    button:disabled { color: #666; cursor: wait; }
    li { margin-block: .35rem; }
    .status { color: #555; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator { display: block; }
  </style>
</head>
<body hx-ext="client-side-templates">
  <main>
    <h1>Декларативность</h1>

    <button
      type="button"
      hx-get="https://dummyjson.com/users?limit=5&amp;select=firstName,lastName,email"
      hx-target="#users"
      hx-swap="innerHTML"
      hx-indicator="#loading"
      hx-disabled-elt="this"
      handlebars-template="users-template"
    >
      Список пользователей
    </button>

    <p id="loading" class="status htmx-indicator">Загрузка…</p>
    <div id="users" class="status" aria-live="polite">
      Нажмите на ссылку, чтобы получить данные.
    </div>

    <script id="users-template" type="text/x-handlebars-template">
      <ul>
        {{#each users}}
          <li>
            <strong>{{firstName}} {{lastName}}</strong>:
            <a href="mailto:{{email}}">{{email}}</a>
          </li>
        {{else}}
          <li>Пользователи не найдены.</li>
        {{/each}}
      </ul>
    </script>
  </main>
</body>
</html>
